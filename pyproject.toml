[project]
name = "teamweaver"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "scipy>=1.13",
    "pulp>=2.8",
    "openai>=1.40",
    "tiktoken>=0.7",
    "neo4j>=5.20",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "neo4j: requires running Neo4j (docker-compose up)",
    "llm: requires OPENAI_API_KEY (never run in CI/pytest default)",
    "slow: long-running (full-scale MILP smoke)",
]
addopts = "-m 'not neo4j and not llm and not slow'"
