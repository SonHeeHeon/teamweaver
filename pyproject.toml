[project]
name = "teamweaver"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "scipy>=1.13",
    "pulp>=2.8,<4",
    "openai>=1.40",
    "tiktoken>=0.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "anyio>=4.0",
]

[dependency-groups]
dev = ["pytest>=8", "pandas>=2.2", "matplotlib>=3.8", "jupyter>=1.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running (full-scale MILP smoke)",
]
addopts = "-m 'not slow'"
