[project]
name = "teamweaver"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "scipy>=1.13",
    "pulp>=2.8,<4",
    "openai>=1.40",
    "tiktoken>=0.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "anyio>=4.0",
    # 서비스 솔버(2026-10-05부터 HiGHS). 예전엔 benchmark 그룹에만 있어 설치 안내대로 `uv sync`하면 지워졌다(2026-10-06 발견).
    "highspy>=1.15.1",
]

[dependency-groups]
benchmark = [
    "pyscipopt>=6.2.1",
]
dev = [
    "pytest>=8",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "jupyter>=1.0",
    "httpx>=0.27",
    "playwright>=1.62.0",
    "pypdf>=6.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running (full-scale MILP smoke)",
]
addopts = "-m 'not slow'"
